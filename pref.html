<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  body { padding: 16px; margin: 0; font: 13px -apple-system, sans-serif; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; }
  small { opacity: 0.6; }
</style>
</head>
<body>
  <label>M3U playlist URL
    <input type="text" data-pref-key="m3u_url" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  </label>
  <small>The playlist address from your IPTV provider or proxy, usually ending in <code>type=m3u_plus</code> or <code>.m3u</code>.</small>
</body>
</html>
